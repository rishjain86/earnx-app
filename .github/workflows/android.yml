name: Build Android APK

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v3

  - name: Setup Node
    uses: actions/setup-node@v3
    with:
      node-version: 18

  - name: Setup Java 17
    uses: actions/setup-java@v3
    with:
      distribution: zulu
      java-version: 17

  - name: Install Dependencies
    run: npm install --legacy-peer-deps

  - name: Build Android
    run: |
      export JAVA_HOME=$JAVA_HOME_17_X64
      export PATH=$JAVA_HOME/bin:$PATH

      rm -rf android

      npx cap add android
      npx cap sync android

      # Add Yandex SDK dependency safely
      sed -i "/dependencies {/a \    implementation 'com.yandex.android:mobileads:7.5.0'" android/app/build.gradle

      # Fix SDK versions
      sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
      sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle
      sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle

      # Add internet permissions
      sed -i '/<manifest/a \<uses-permission android:name="android.permission.INTERNET"\/>\n\<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml

      cd android

      chmod +x gradlew

      ./gradlew clean
      ./gradlew assembleRelease --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: EarnX-Yandex-Build
      path: android/app/build/outputs/apk/release/app-release-unsigned.apk
