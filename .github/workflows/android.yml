name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with: { node-version: '18' }

      - name: Setup Java
        uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }

      - name: 1. Setup www folder
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          if [ -f "script.js" ]; then cp script.js www/; fi
          if [ -f "style.css" ]; then cp style.css www/; fi
          if [ -d "assets" ]; then cp -r assets www/; fi

      - name: 2. Capacitor Sync
        run: npx cap sync android

      - name: 3. Build APK (Direct Gradle)
        run: |
          cd android
          # Missing gradlew file ki zarurat nahi, system ka gradle use karenge
          gradle assembleRelease

      - name: 4. Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
