name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18' }
      - uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }

      - name: Build Web
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          if [ -d "assets" ]; then cp -r assets www/; fi

      - name: Sync
        run: npx cap sync android

      - name: Final Build
        run: |
          # Pehle check karo ki file kahan hai
          ls -R android/
          
          # Ab seedha full path use karke build karo
          ./android/gradlew assembleRelease -p android

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
