name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with: { node-version: '18' }

      - name: Setup Java
        uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }

      - name: 1. Setup www folder
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          if [ -f "script.js" ]; then cp script.js www/; fi
          if [ -f "style.css" ]; then cp style.css www/; fi
          if [ -d "assets" ]; then cp -r assets www/; fi

      - name: 2. Fresh Android Generate & Set Icons
        run: |
          rm -rf android
          npm install @capacitor/android @capacitor/splash-screen
          npx cap add android
          npm run generate-icons
          npx cap sync android

      - name: 2.5 Inject InMobi Code (Solid Background Banner Fix)
        run: |
          # Add AD_ID Permission
          sed -i '/<application/i \    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>' android/app/src/main/AndroidManifest.xml
          
          # Allow Cleartext Traffic & Hardware Acceleration
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' android/app/src/main/AndroidManifest.xml
          
          # Add InMobi SDK Dependencies
          sed -i "s/dependencies {/dependencies {\n    implementation 'com.inmobi.monetization:inmobi-ads-kotlin:11.3.0'\n    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'/g" android/app/build.gradle
          
          # Create MainActivity.java
          cat << 'EOF' > android/app/src/main/java/com/earnx/app/MainActivity.java
          package com.earnx.app;
          
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.view.Gravity;
          import android.widget.Toast;
          import android.graphics.Color; // Added for Background Color
          
          import com.getcapacitor.BridgeActivity;
          
          import com.inmobi.sdk.InMobiSdk;
          import com.inmobi.sdk.SdkInitializationListener;
          import com.inmobi.ads.InMobiInterstitial;
          import com.inmobi.ads.InMobiBanner;
          import com.inmobi.ads.listeners.InterstitialAdEventListener;
          import com.inmobi.ads.listeners.BannerAdEventListener;
          import com.inmobi.ads.AdMetaInfo;
          import com.inmobi.ads.InMobiAdRequestStatus;
          import org.json.JSONObject;
          
          public class MainActivity extends BridgeActivity {
              private InMobiInterstitial rewardedAd;
              private InMobiInterstitial interstitialAd;
              private InMobiBanner bannerAd;
              private FrameLayout bannerContainer; // New container for solid background
          
              public class InMobiJSInterface {
                  @JavascriptInterface
                  public void showRewardedAd() {
                      runOnUiThread(() -> {
                          if (rewardedAd != null && rewardedAd.isReady()) {
                              rewardedAd.show();
                          } else {
                              Toast.makeText(MainActivity.this, "Ad not ready, reloading...", Toast.LENGTH_SHORT).show();
                              loadRewardedAd();
                          }
                      });
                  }
          
                  @JavascriptInterface
                  public void showInterstitialAd() {
                      runOnUiThread(() -> {
                          if (interstitialAd != null && interstitialAd.isReady()) {
                              interstitialAd.show();
                          } else {
                              loadInterstitialAd();
                          }
                      });
                  }
                  
                  @JavascriptInterface
                  public void showBannerAd() {
                      runOnUiThread(() -> setupBannerAd());
                  }
                  
                  @JavascriptInterface
                  public void hideBannerAd() {
                      runOnUiThread(() -> {
                          if (bannerContainer != null) {
                              ((ViewGroup) bannerContainer.getParent()).removeView(bannerContainer);
                              bannerContainer = null;
                              bannerAd = null;
                          }
                      });
                  }
              }
          
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  JSONObject consentObject = new JSONObject();
                  try {
                      consentObject.put("gdpr", "0");
                  } catch (Exception e) {}
                  
                  InMobiSdk.init(this, "7c5237d8955d463c827bd9a79eb3890e", consentObject, new SdkInitializationListener() {
                      @Override
                      public void onInitializationComplete(Error error) {
                          runOnUiThread(() -> {
                              if (error == null) {
                                  loadRewardedAd();
                                  loadInterstitialAd();
                              } else {
                                  Toast.makeText(MainActivity.this, "Init Error: " + error.getMessage(), Toast.LENGTH_LONG).show();
                              }
                          });
                      }
                  });
                  
                  bridge.getWebView().addJavascriptInterface(new InMobiJSInterface(), "InMobiBridge");
              }
          
              private void loadRewardedAd() {
                  rewardedAd = new InMobiInterstitial(MainActivity.this, 10000712637L, new InterstitialAdEventListener() {
                      @Override
                      public void onAdLoadFailed(InMobiInterstitial ad, InMobiAdRequestStatus status) {
                          // Silent fail
                      }
                      @Override
                      public void onAdDismissed(InMobiInterstitial inMobiInterstitial) {
                          loadRewardedAd();
                      }
                  });
                  rewardedAd.load();
              }
          
              private void loadInterstitialAd() {
                  interstitialAd = new InMobiInterstitial(MainActivity.this, 10000712635L, new InterstitialAdEventListener() {
                      @Override
                      public void onAdLoadFailed(InMobiInterstitial ad, InMobiAdRequestStatus status) {
                          // Silent fail
                      }
                      @Override
                      public void onAdDismissed(InMobiInterstitial inMobiInterstitial) {
                          loadInterstitialAd();
                      }
                  });
                  interstitialAd.load();
              }
              
              private void setupBannerAd() {
                  if (bannerAd == null) {
                      bannerAd = new InMobiBanner(MainActivity.this, 10000712636L);
                      bannerAd.setListener(new BannerAdEventListener() {
                          @Override
                          public void onAdLoadFailed(InMobiBanner ad, InMobiAdRequestStatus status) {
                              // Silent fail
                          }
                      });
                      
                      float density = getResources().getDisplayMetrics().density;
                      int widthPx = (int) (320 * density + 0.5f);
                      int heightPx = (int) (50 * density + 0.5f);
                      
                      bannerAd.setBannerSize(320, 50);
                      
                      // 1. Create a full-width container with a Solid Black Background
                      bannerContainer = new FrameLayout(MainActivity.this);
                      bannerContainer.setBackgroundColor(Color.parseColor("#000000")); // Pure Black Background
                      
                      // 2. Set container to take full width at the bottom
                      FrameLayout.LayoutParams containerParams = new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              heightPx,
                              Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL
                      );
                      
                      // 3. Center the 320x50 Banner inside this black container
                      FrameLayout.LayoutParams adParams = new FrameLayout.LayoutParams(
                              widthPx,
                              heightPx,
                              Gravity.CENTER
                      );
                      
                      bannerContainer.addView(bannerAd, adParams);
                      
                      // 4. Attach the solid container to the DecorView
                      ViewGroup decorView = (ViewGroup) getWindow().getDecorView();
                      decorView.addView(bannerContainer, containerParams);
                      bannerAd.load();
                  }
              }
          }
          EOF

      - name: 2.6 Fix Build Requirements (Java 17 & SDK 34)
        run: |
          sed -i "s/compileSdkVersion = 33/compileSdkVersion = 34/g" android/variables.gradle
          sed -i "s/targetSdkVersion = 33/targetSdkVersion = 34/g" android/variables.gradle
          sed -i "s/minSdkVersion = 22/minSdkVersion = 24/g" android/variables.gradle
          sed -i "s/VERSION_1_8/VERSION_17/g" android/app/build.gradle

      - name: 3. Build Unsigned APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 3.5 Automatically Sign APK
        run: |
          keytool -genkey -v -keystore earnx.jks -alias earnx_key -keyalg RSA -keysize 2048 -validity 10000 -storepass earnx123 -keypass earnx123 -dname "CN=EarnX, O=EarnX, C=IN"
          APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER_PATH sign --ks earnx.jks --ks-key-alias earnx_key --ks-pass pass:earnx123 --key-pass pass:earnx123 --out android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          $APKSIGNER_PATH verify android/app/build/outputs/apk/release/app-release-signed.apk

      - name: 4. Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Signed-APK
          path: android/app/build/outputs/apk/release/app-release-signed.apk
