name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18' }
      - uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }

      - name: Prepare Assets
        run: |
          # 1. Root se files ko www folder mein copy karo (Capacitor yahi dhoondhta hai)
          mkdir -p www
          cp -r . www/ || true
          # Hatao jo zaroori nahi hai (node_modules, android, .git)
          rm -rf www/node_modules www/android www/.git www/.github
          
      - name: Build Android
        run: |
          # 2. Sync ab fail nahi hoga kyunki www folder ab files se bhara hai
          npx cap sync android
          
          # 3. Build (Direct path se)
          ./android/gradlew assembleRelease -p android

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
