name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: {node-version: '18'}
      - uses: actions/setup-java@v3
        with: {distribution: 'zulu', java-version: '17'}

      - name: Build Web Assets
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          cp index.html www/ 2>/dev/null || echo "No index.html"
          
      - name: Prepare Android & Register Plugin
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          
          # 1. Yandex SDK dependency
          echo "dependencies { implementation 'com.yandex.android:mobileads:8.0.0' }" >> android/app/build.gradle
          
          # 2. MainActivity mein plugin register karo
          sed -i '/import com.getcapacitor.BridgeActivity;/a import com.earnx.app.YandexAdsPlugin;' android/app/src/main/java/com/earnx/app/MainActivity.java
          sed -i '/super.onCreate(savedInstanceState);/a \        this.registerPlugin(YandexAdsPlugin.class);' android/app/src/main/java/com/earnx/app/MainActivity.java

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final-Success-Build
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          
