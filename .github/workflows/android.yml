name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with: { node-version: '18' }

      - name: Setup Java
        uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }

      - name: 1. Setup www folder
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          if [ -f "script.js" ]; then cp script.js www/; fi
          if [ -f "style.css" ]; then cp style.css www/; fi
          if [ -d "assets" ]; then cp -r assets www/; fi

      - name: 2. Fresh Android Generate & Set Icons
        run: |
          rm -rf android
          npm install @capacitor/android @capacitor/splash-screen
          npx cap add android
          npm run generate-icons
          npx cap sync android

      - name: 2.5 Inject Start.io Code (Correct App ID)
        run: |
          sed -i "s/dependencies {/dependencies {\n    implementation 'com.startapp:inapp-sdk:5.1.0'/g" android/app/build.gradle
          
          cat << 'EOF' > android/app/src/main/java/com/earnx/app/MainActivity.java
          package com.earnx.app;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;
          import com.startapp.sdk.adsbase.Ad;

          public class MainActivity extends BridgeActivity {
              private StartAppAd rewardedVideo;

              public class StartIoJSInterface {
                  @JavascriptInterface
                  public void showRewardedAd() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (rewardedVideo != null && rewardedVideo.isReady()) {
                                  rewardedVideo.showAd();
                                  loadNextAd();
                              } else {
                                  rewardedVideo = new StartAppAd(MainActivity.this);
                                  rewardedVideo.loadAd(StartAppAd.AdMode.REWARDED_VIDEO, new AdEventListener() {
                                      @Override
                                      public void onReceiveAd(Ad ad) {
                                          rewardedVideo.showAd();
                                          loadNextAd();
                                      }
                                      @Override
                                      public void onFailedToReceiveAd(Ad ad) { }
                                  });
                              }
                          }
                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Start.io Initialization with CORRECT APP ID
                  StartAppSDK.init(this, "204808781", false);
                  StartAppSDK.setTestAdsEnabled(false); 
                  StartAppAd.disableSplash();
                  
                  loadNextAd();
                  
                  bridge.getWebView().addJavascriptInterface(new StartIoJSInterface(), "StartIoBridge");
              }

              private void loadNextAd() {
                  rewardedVideo = new StartAppAd(MainActivity.this);
                  rewardedVideo.loadAd(StartAppAd.AdMode.REWARDED_VIDEO);
              }
          }
          EOF

      - name: 3. Build Unsigned APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 3.5 Automatically Sign APK
        run: |
          keytool -genkey -v -keystore earnx.jks -alias earnx_key -keyalg RSA -keysize 2048 -validity 10000 -storepass earnx123 -keypass earnx123 -dname "CN=EarnX, O=EarnX, C=IN"
          APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER_PATH sign --ks earnx.jks --ks-key-alias earnx_key --ks-pass pass:earnx123 --key-pass pass:earnx123 --out android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          $APKSIGNER_PATH verify android/app/build/outputs/apk/release/app-release-signed.apk

      - name: 4. Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Signed-APK
          path: android/app/build/outputs/apk/release/app-release-signed.apk
