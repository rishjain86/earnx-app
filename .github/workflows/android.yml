name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Assets
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          if [ -f style.css ]; then cp style.css www/; fi
          if [ -d assets ]; then cp -r assets www/; fi

      - name: Prepare Android Project
        run: |
          # Pehle check karo ki android folder hai ya nahi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Yandex & Plugin
        run: |
          # Yandex Dependency
          sed -i "/dependencies {/a \    implementation 'com.yandex.android:mobileads:7.5.0'" android/app/build.gradle
          
          # Plugin Creation
          mkdir -p android/app/src/main/java/com/earnx/app/
          echo 'package com.earnx.app;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginCall;
          @CapacitorPlugin(name = "YandexAds")
          public class YandexAdsPlugin extends Plugin {
              @com.getcapacitor.PluginMethod
              public void loadRewarded(PluginCall call) { call.resolve(); }
          }' > android/app/src/main/java/com/earnx/app/YandexAdsPlugin.java

      - name: Final Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
