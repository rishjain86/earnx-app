name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install cordova-plugin-androidx-adapter --save

      - name: Sync & Prepare
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Custom Yandex Plugin
        run: |
          mkdir -p android/app/src/main/java/com/earnx/app/
          echo 'package com.earnx.app;
          import android.app.Activity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.JSObject;
          import com.yandex.mobile.ads.common.AdRequest;
          import com.yandex.mobile.ads.common.Reward;
          import com.yandex.mobile.ads.rewarded.RewardedAd;
          import com.yandex.mobile.ads.rewarded.RewardedAdEventListener;
          @CapacitorPlugin(name = "YandexAds")
          public class YandexAdsPlugin extends Plugin {
              private RewardedAd rewardedAd;
              @com.getcapacitor.PluginMethod
              public void loadRewarded(PluginCall call) {
                  Activity activity = getActivity();
                  rewardedAd = new RewardedAd(activity);
                  rewardedAd.setAdUnitId("R-M-19301521-2");
                  AdRequest adRequest = new AdRequest.Builder().build();
                  rewardedAd.setRewardedAdEventListener(new RewardedAdEventListener() {
                      public void onAdLoaded() { rewardedAd.show(); }
                      public void onRewarded(Reward reward) { JSObject ret = new JSObject(); ret.put("success", true); notifyListeners("rewarded", ret); }
                      public void onAdFailedToLoad(com.yandex.mobile.ads.common.AdRequestError e) { JSObject ret = new JSObject(); ret.put("success", false); notifyListeners("rewarded", ret); }
                  });
                  rewardedAd.loadAd(adRequest);
                  call.resolve();
              }
          }' > android/app/src/main/java/com/earnx/app/YandexAdsPlugin.java

      - name: Fix Manifest & Gradle
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/dependencies {/dependencies {\n    implementation "com.yandex.android:mobileads:7.5.0"/' android/app/build.gradle
          # Fix for Manifest Merger
          sed -i 's|<application|<application tools:replace="android:appComponentFactory" android:appComponentFactory="androidx.core.app.CoreComponentFactory"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' android/app/src/main/AndroidManifest.xml
          npx jetifier

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
