name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18' }
      - uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }

      - name: Create Web Build
        run: |
          npm install --legacy-peer-deps
          # Hum ek dum naya 'www' folder bana rahe hain aur usme files copy kar rahe hain
          mkdir -p www
          cp index.html www/
          cp script.js www/ 2>/dev/null || true
          cp style.css www/ 2>/dev/null || true
          if [ -d "assets" ]; then cp -r assets www/; fi
          # Capacitor ko batane ke liye ki 'index.html' mil gaya hai
          ls -la www/ 

      - name: Sync and Build
        run: |
          # 'rm -rf android' hata diya hai taaki purani configs bane rahein
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
