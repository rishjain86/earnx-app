name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: {node-version: '18'}
      - uses: actions/setup-java@v3
        with: {distribution: 'zulu', java-version: '21'}

      - name: Setup Environment
        run: |
          mkdir -p www
          if [ ! -f index.html ]; then touch index.html; fi
          cp index.html www/
          npm install --legacy-peer-deps

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Update Gradle & Add Yandex SDK
        run: |
          # 1. Update Gradle Wrapper to 8.7
          sed -i 's/gradle-[0-9\.]*-all\.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Add Yandex SDK & Repositories to build.gradle
          sed -i '/dependencies {/a \    implementation "com.yandex.android:mobileads:8.0.0"' android/app/build.gradle
          sed -i '/repositories {/a \        mavenCentral()' android/build.gradle
          
          # 3. Internet Permission
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Yandex-Native-Build
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
