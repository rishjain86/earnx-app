name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Full Build Process
        run: |
          # 1. Prepare Web Assets
          npm install --legacy-peer-deps
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          if [ -f style.css ]; then cp style.css www/; fi
          if [ -d assets ]; then cp -r assets www/; fi

          # 2. Setup Android
          npx cap add android || true
          npx cap sync android

          # 3. Create Plugin and Inject Dependencies
          mkdir -p android/app/src/main/java/com/earnx/app/
          echo 'package com.earnx.app;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginCall;
          @CapacitorPlugin(name = "YandexAds")
          public class YandexAdsPlugin extends Plugin {
              @com.getcapacitor.PluginMethod
              public void loadRewarded(PluginCall call) { call.resolve(); }
          }' > android/app/src/main/java/com/earnx/app/YandexAdsPlugin.java

          # Inject Yandex into the generated gradle file
          sed -i "/dependencies {/a \    implementation 'com.yandex.android:mobileads:7.5.0'" android/app/build.gradle

          # 4. Build
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
