name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Remove Fake Cordova Plugins
        run: |
          npm uninstall cordova-plugin-unityads @awesome-cordova-plugins/core || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/assets --save-dev --legacy-peer-deps

      - name: Prepare Web Folder
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp script.js www/ || true
          cp style.css www/ || true
          cp sw.js www/ || true
          cp -r assets www/assets/ || true

      - name: Generate Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: 🚀 INJECT OFFICIAL UNITY NATIVE SDK 🚀
        run: |
          sed -i '/dependencies {/a \    implementation "com.unity3d.ads:unity-ads:4.12.1"' android/app/build.gradle
          
          cat << 'EOF' > android/app/src/main/java/com/earnx/app/MainActivity.java
          package com.earnx.app;

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;

          public class MainActivity extends BridgeActivity {
              private String unityGameID = "6105265";
              private Boolean testMode = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  UnityAds.initialize(getApplicationContext(), unityGameID, testMode, new IUnityAdsInitializationListener() {
                      @Override
                      public void onInitializationComplete() {}
                      @Override
                      public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {}
                  });
              }

              @Override
              public void onResume() {
                  super.onResume();
                  WebView webView = this.bridge.getWebView();
                  webView.addJavascriptInterface(new UnityAdsJSInterface(), "NativeUnity");
              }

              private class UnityAdsJSInterface {
                  @JavascriptInterface
                  public void showRewardedAd(String placementId) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              UnityAds.show(MainActivity.this, placementId, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                      runOnUiThread(() -> bridge.getWebView().evaluateJavascript("javascript:window.onNativeAdComplete('failed');", null));
                                  }
                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}
                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}
                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                      if (state == UnityAds.UnityAdsShowCompletionState.COMPLETED) {
                                          runOnUiThread(() -> bridge.getWebView().evaluateJavascript("javascript:window.onNativeAdComplete('success');", null));
                                      } else {
                                          runOnUiThread(() -> bridge.getWebView().evaluateJavascript("javascript:window.onNativeAdComplete('failed');", null));
                                      }
                                  }
                              });
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitialAd(String placementId) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              UnityAds.show(MainActivity.this, placementId);
                          }
                      });
                  }
              }
          }
          EOF

      - name: Upgrade Gradle & AGP for Java 21 (Crucial Fix)
        run: |
          sed -i 's/gradle-[0-9\.]*-all\.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-[0-9\.]*-bin\.zip/gradle-8.7-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/com.android.tools.build:gradle:[0-9\.]*/com.android.tools.build:gradle:8.3.0/g' android/build.gradle || true

      - name: Deep Clean Default Android Assets
        run: |
          find android/app/src/main/res -name "ic_launcher*" -delete
          find android/app/src/main/res -name "ic_launcher_round*" -delete
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/* || true

      - name: Generate App Icons & Splash
        run: |
          npx capacitor-assets generate --android

      - name: Update App Name & Version
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">EarnX<\/string>/g' android/app/src/main/res/values/strings.xml || true
          sed -i 's/versionCode [0-9]*/versionCode 8/g' android/app/build.gradle || true
          sed -i 's/versionName "[0-9.]*"/versionName "8.0"/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle || true
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' android/variables.gradle || true

      - name: Setup Release Signing
        run: |
          sed -i 's/release {/release {\n            signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Rename APK for Release
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/EarnX_v8.0_Release.apk || true
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/EarnX_v8.0_Release.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-v8.0-Release
          path: android/app/build/outputs/apk/release/EarnX_v8.0_Release.apk
          
