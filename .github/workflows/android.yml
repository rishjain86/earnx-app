name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18' }
      - uses: actions/setup-java@v3
        with: { distribution: 'zulu', java-version: '17' }

      - name: Compile
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          cp index.html script.js style.css www/ 2>/dev/null || true
          
          # Delete existing to prevent lock
          rm -rf android
          npx cap add android
          npx cap sync android

          # Create Plugin
          mkdir -p android/app/src/main/java/com/earnx/app/
          echo 'package com.earnx.app;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginCall;
          @CapacitorPlugin(name = "YandexAds")
          public class YandexAdsPlugin extends Plugin {
              @com.getcapacitor.PluginMethod
              public void loadRewarded(PluginCall call) { call.resolve(); }
          }' > android/app/src/main/java/com/earnx/app/YandexAdsPlugin.java

          # Direct Gradle Append
          echo "dependencies { implementation 'com.yandex.android:mobileads:7.5.0' }" >> android/app/build.gradle
          
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
