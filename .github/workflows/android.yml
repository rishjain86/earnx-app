name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: {node-version: '18'}
      - uses: actions/setup-java@v3
        with: {distribution: 'zulu', java-version: '17'} # 17 is most stable for Capacitor

      - name: Install & Sync
        run: |
          mkdir -p www
          [ -f index.html ] && cp index.html www/
          npm install --legacy-peer-deps
          # Plugin install karo
          npm install https://github.com/maximnara/cordova-plugin-yandex-ads
          npx cap add android || true
          npx cap sync android

      - name: Configure Gradle for AndroidX
        run: |
          # 1. Gradle 8.7 setup
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Force AndroidX (Crucial for Resolving Errors)
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # 3. Increase memory for build
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Build Release
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final-Release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          
