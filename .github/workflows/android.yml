name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: {node-version: '18'}
      - uses: actions/setup-java@v3
        with: {distribution: 'zulu', java-version: '17'}

      - name: Clean & Sync
        run: |
          # 1. Purana kachra saaf karo
          rm -rf android/
          npm install --legacy-peer-deps
          # 2. Plugin uninstall karo (bahut zaroori hai)
          npm uninstall cordova-plugin-yandex-ads || true
          
      - name: Generate Android
        run: |
          npx cap add android
          npx cap sync android
          # Force Gradle 8.7
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > android/gradle/wrapper/gradle-wrapper.properties

      - name: Inject Yandex Native SDK (The only way)
        run: |
          # Plugin ki jagah direct SDK
          echo "dependencies { implementation 'com.yandex.android:mobileads:8.0.0' }" >> android/app/build.gradle
          # Java 17 config
          sed -i '/compileOptions {/,/}/c\    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }' android/app/build.gradle

      - name: Build
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final-Clean-Build
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
