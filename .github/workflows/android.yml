name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: {node-version: '18'}
      - uses: actions/setup-java@v3
        with: {distribution: 'zulu', java-version: '21'}

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject Yandex Native SDK
        run: |
          # Add SDK to build.gradle
          echo "dependencies { implementation 'com.yandex.android:mobileads:7.0.0' }" >> android/app/build.gradle
          
          # Add Internet permission to Manifest
          sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnX-Final-Ads-Ready
          path: android/app/build/outputs/apk/release/app-release.apk
